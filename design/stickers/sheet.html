<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Thambi stickers</title>
<style>body{margin:0;background:#fff;font-family:Geist,system-ui,sans-serif;padding:32px}
h1{font-size:28px;margin:0 0 20px;color:#0F172A}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px}
figure{margin:0;background:#EEF7F6;border-radius:20px;padding:20px;text-align:center}
img{width:140px;height:140px}
figcaption{margin-top:10px;font-size:15px;color:#475569}</style></head><body>
<h1>Thambi sticker set</h1>
<div class="grid">
<figure><img src="report-pin.svg" alt=""><figcaption>Report: pin with tick</figcaption></figure>
<figure><img src="pothole.svg" alt=""><figcaption>Road: pothole</figcaption></figure>
<figure><img src="water-leak.svg" alt=""><figcaption>Water: leaking pipe</figcaption></figure>
<figure><img src="neighbours.svg" alt=""><figcaption>Me too: neighbours join</figcaption></figure>
<figure><img src="verified-seal.svg" alt=""><figcaption>Verified: seal</figcaption></figure>
</div></body></html>
