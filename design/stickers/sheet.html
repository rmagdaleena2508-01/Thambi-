<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Thambi sticker set</title>
<style>
body{margin:0;background:#fff;font-family:Geist,system-ui,sans-serif;padding:32px;color:#0F172A}
h1{font-size:28px;margin:0 0 6px}
p.sub{margin:0 0 24px;color:#475569;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
figure{margin:0;background:#fff;border:1px solid #E2E8F0;border-radius:20px;padding:20px;text-align:center}
figure img{width:150px;height:150px}
figcaption{margin-top:10px;font-size:15px;color:#475569}
.tile{margin-top:28px;border-radius:20px;height:240px;background:#FFFFFF url("city-grid.svg") repeat;border:1px solid #E2E8F0}
.tile-label{margin-top:10px;font-size:15px;color:#475569}
</style></head><body>
<h1>Thambi sticker set</h1>
<p class="sub">Flat isometric, pastel disc, no text, no outlines, one soft ground ellipse at 18%.</p>
<div class="grid">
<figure><img src="report-pin.svg" alt=""><figcaption>Report: pin with tick</figcaption></figure>
<figure><img src="pothole.svg" alt=""><figcaption>Road damage: pothole and cone</figcaption></figure>
<figure><img src="water-leak.svg" alt=""><figcaption>Water: leaking pipe and drop</figcaption></figure>
<figure><img src="neighbours.svg" alt=""><figcaption>Me too: two neighbours and plus</figcaption></figure>
<figure><img src="verified-seal.svg" alt=""><figcaption>Verified: rosette seal and tick</figcaption></figure>
</div>
<div class="tile" role="img" aria-label="Isometric grid tile preview"></div>
<p class="tile-label">Isometric grid tile, teal at 10% opacity, seamless (48 by 55.43).</p>
</body></html>
